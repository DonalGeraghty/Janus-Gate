name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual trigger

env:
  PROJECT_ID: donal-geraghty-home
  # Codename Janus — Roman god of gateways; service id: janus-gate
  SERVICE_NAME: janus-gate
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Validate imports
        run: |
          python -c "from services.firebase_service import initialize_firebase; print('✅ Firebase service imports successful')"
          python -c "from services.logging_service import logger; print('✅ Logging service imports successful')"
          python -c "from core.auth_service import register_user, login_user; print('✅ Auth service imports successful')"
          python -c "from app import app; print('✅ Flask app imports successful')"

      - name: Run tests
        env:
          FLASK_ENV: development
          JWT_SECRET_KEY: test-secret
        run: python -m unittest discover -s tests -v
      
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        
      - name: Configure Docker
        run: gcloud auth configure-docker
        
      - name: Set project
        run: gcloud config set project ${{ env.PROJECT_ID }}
        
      - name: Enable APIs
        run: |
          gcloud services enable run.googleapis.com
          gcloud services enable firestore.googleapis.com
          gcloud services enable cloudbuild.googleapis.com
          gcloud services enable cloudkms.googleapis.com
          
      - name: Create service account if not exists
        run: |
          if ! gcloud iam service-accounts describe janus-gate@${{ env.PROJECT_ID }}.iam.gserviceaccount.com &> /dev/null; then
            gcloud iam service-accounts create janus-gate \
              --display-name="Janus (portfolio auth API)"
          fi
          
      - name: Grant Firestore permissions
        run: |
          gcloud projects add-iam-policy-binding ${{ env.PROJECT_ID }} \
            --member="serviceAccount:janus-gate@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/datastore.user"
          gcloud projects add-iam-policy-binding ${{ env.PROJECT_ID }} \
            --member="serviceAccount:janus-gate@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/datastore.viewer"

      - name: Grant KMS key permissions
        run: |
          gcloud kms keys add-iam-policy-binding user-openai-keys \
            --keyring=janus-gate \
            --location="${REGION}" \
            --member="serviceAccount:janus-gate@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role="roles/cloudkms.cryptoKeyEncrypterDecrypter"
            
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --service-account janus-gate@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10 \
            --timeout 300 \
            --set-env-vars "FLASK_ENV=production,JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},OPENAI_MODEL=gpt-5.6-sol,MISTRAL_MODEL=mistral-small-2603,ANTHROPIC_MODEL=claude-sonnet-5,AI_KMS_KEY_NAME=projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/keyRings/janus-gate/cryptoKeys/user-openai-keys"
            
      - name: Get service URL
        id: service-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT
          
      - name: Test deployment
        run: |
          echo "Testing deployed service at ${{ steps.service-url.outputs.url }}"
          curl -f ${{ steps.service-url.outputs.url }}/health || exit 1
          
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Deployment successful!**\n\nAuth API live at:\n${{ steps.service-url.outputs.url }}\n\n**Endpoints:**\n- POST ${{ steps.service-url.outputs.url }}/api/auth/register\n- POST ${{ steps.service-url.outputs.url }}/api/auth/login\n- GET ${{ steps.service-url.outputs.url }}/api/auth/me\n- GET ${{ steps.service-url.outputs.url }}/health`
            })
